<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tentang KodeKita</title>

    <link
        rel="stylesheet"
        href="./dist/output.css"
    >

</head>


<body>

    <!-- =====================================================
         TENTANG KODEKITA
    ====================================================== -->

    <section
        id="tentang"

        class="
            min-h-screen

            bg-[#F7F7F5]

            px-6
            py-24

            md:px-12
            lg:px-20
        "
    >

        <div
            class="
                mx-auto

                flex
                min-h-[calc(100vh-12rem)]

                max-w-6xl

                items-center
                justify-between

                gap-16

                max-lg:flex-col
                max-lg:justify-center
                max-lg:gap-12
            "
        >

            <!-- =================================================
                 TEXT
            ================================================== -->

            <div
                class="
                    w-full
                    max-w-xl
                "
            >

                <!-- TITLE -->

                <h1
                    class="
                        text-4xl

                        font-medium

                        leading-tight

                        tracking-tight

                        text-neutral-600

                        md:text-5xl
                    "
                >
                    Tentang KodeKita
                </h1>


                <!-- DESCRIPTION -->

                <p
                    class="
                        mt-12

                        max-w-sm

                        text-sm

                        leading-relaxed

                        text-neutral-500
                    "
                >
                    KodeKita adalah ruang untuk belajar,
                    berbagi, dan berkarya bersama melalui
                    teknologi. Kami hadir untuk mendorong
                    kreativitas, meningkatkan kemampuan
                    digital, serta membangun semangat
                    kolaborasi di antara para pelajar.
                </p>


                <!-- BUTTON -->

                <a
                    href="#"

                    class="
                        mt-5

                        inline-flex

                        items-center
                        justify-center

                        rounded-lg

                        bg-neutral-700

                        px-3
                        py-2

                        text-xs

                        font-medium

                        text-white

                        shadow

                        transition

                        hover:-translate-y-0.5
                        hover:bg-neutral-800
                    "
                >
                    Mulai Perjalanan Anda
                </a>

            </div>


            <!-- =================================================
                 IMAGE
            ================================================== -->

            <div
                class="
                    w-full

                    max-w-sm
                "
            >

                <img
                    src="./assets/about.jpg"

                    alt="Tentang KodeKita"

                    class="
                        h-[315px]

                        w-full

                        rounded-[45px]

                        object-cover
                        object-center

                        transition
                        duration-500

                        hover:scale-[1.02]
                    "
                >

            </div>

        </div>

    </section>

</body>

</html>
