<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kontak KodeKita</title>

    <link rel="stylesheet" href="./dist/output.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>

  <body class="m-0 h-screen overflow-hidden bg-[#181B1C] font-['Manrope'] text-white">

    <header
      class="sticky top-0 z-50 flex h-[60px] w-full items-center justify-between bg-black px-6 sm:px-10 lg:px-12"
    >
      <a
        href="index.html"
        class="font-['Bitcount_Grid_Double'] text-[26px] font-normal leading-none tracking-[1px] text-white"
      >
        KodeKita
      </a>

      <a
        href="index.html"
        class="flex h-[34px] w-[90px] items-center justify-center rounded-[7px] bg-white text-[12px] font-normal text-neutral-800 transition hover:bg-neutral-200"
      >
        Kembali
      </a>
    </header>

    <main class="flex h-[calc(100vh-60px)] w-full">

      <!-- FORM SIDE -->

      <section
        aria-labelledby="contact-heading"
        class="flex w-full flex-col justify-center overflow-y-auto px-6 py-8 sm:px-10 md:w-[55%] md:px-12 lg:px-16"
      >
        <h1
          id="contact-heading"
          class="m-0 text-[36px] font-normal leading-[1.08] tracking-[-2px] text-neutral-100 sm:text-[44px] lg:text-[52px]"
        >
          Hubungi KodeKita
        </h1>

        <p class="m-0 mt-4 text-[13px] font-normal leading-normal text-neutral-400">
          Isi form di bawah untuk menghubungi KodeKita.
        </p>

        <form
          id="form-contact"
          method="POST"
          class="mt-8 flex w-full max-w-[400px] flex-col"
        >
          <label class="text-[12px] font-normal text-neutral-400">
            Nama lengkap
          </label>
          <input
            type="text"
            name="name"
            class="mt-1.5 h-8 border-0 border-b border-neutral-600 bg-transparent px-2 text-[14px] text-white outline-none transition focus:border-neutral-300"
          />

          <label class="mt-5 text-[12px] font-normal text-neutral-400">
            Email
          </label>
          <input
            type="email"
            name="email"
            class="mt-1.5 h-8 border-0 border-b border-neutral-600 bg-transparent px-2 text-[14px] text-white outline-none transition focus:border-neutral-300"
          />

          <label class="mt-5 text-[12px] font-normal text-neutral-400">
            Subjek
          </label>
          <input
            type="text"
            name="subject"
            class="mt-1.5 h-8 border-0 border-b border-neutral-600 bg-transparent px-2 text-[14px] text-white outline-none transition focus:border-neutral-300"
          />

          <label class="mt-5 text-[12px] font-normal text-neutral-400">
            Pesan
          </label>
          <textarea
            name="message"
            rows="3"
            class="mt-1.5 resize-none border-0 border-b border-neutral-600 bg-transparent px-2 py-1 text-[14px] text-white outline-none transition focus:border-neutral-300"
          ></textarea>

          <button
            type="submit"
            class="mt-6 h-9 w-full bg-[#777777] text-[12px] font-normal text-white transition hover:bg-[#888888]"
          >
            Kirim
          </button>
        </form>
      </section>

      <!-- IMAGE SIDE -->

      <aside
        class="relative hidden h-full md:block md:w-[45%]"
        aria-hidden="true"
      >
        <img
          src="./assets/contact.png"
          alt=""
          class="h-full w-full object-cover object-center"
        />

        <div class="absolute inset-0 bg-black/45"></div>

        <div class="absolute bottom-6 right-10 z-10 w-[190px] text-right">
          <div>
            <p class="m-0 text-[11px] font-normal text-neutral-300">
              Kunjungi Kami
            </p>
            <p class="m-0 mt-2 text-[11px] font-normal leading-[1.4] text-neutral-300">
              Jl. Contoh No. 123<br />
              Jakarta, Indonesia
            </p>
          </div>

          <div class="mt-5">
            <p class="m-0 text-[11px] font-normal text-neutral-300">
              Talk to us
            </p>
            <p class="m-0 mt-2 text-[11px] font-normal leading-[1.4] text-neutral-300">
              +62 812-8888-8888<br />
              kodekita@gmail.com
            </p>
          </div>

          <div class="mt-3.5 flex justify-end gap-2.5 border-t border-neutral-500/60 pt-2">
            <a href="#" aria-label="Instagram" class="text-neutral-300 transition hover:text-white">
              <iconify-icon icon="mdi:instagram" width="15" height="15"></iconify-icon>
            </a>
            <a href="#" aria-label="LinkedIn" class="text-neutral-300 transition hover:text-white">
              <iconify-icon icon="mdi:linkedin" width="15" height="15"></iconify-icon>
            </a>
            <a href="#" aria-label="GitHub" class="text-neutral-300 transition hover:text-white">
              <iconify-icon icon="mdi:github" width="15" height="15"></iconify-icon>
            </a>
            <a href="mailto:kodekita@gmail.com" aria-label="Email" class="text-neutral-300 transition hover:text-white">
              <iconify-icon icon="mdi:email-outline" width="15" height="15"></iconify-icon>
            </a>
          </div>
        </div>
      </aside>

    </main>

    <script src="js/form.js"></script>
  </body>
</html>
