<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tentang KodeKita</title>

    <link
        rel="stylesheet"
        href="./dist/output.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body
    class="
        m-0
        bg-[#F7F7F5]
        font-['Manrope']
        text-neutral-600
    "
>

    <section
        id="tentang"
        class="
            flex
            min-h-screen
            items-center
            bg-[#F7F7F5]
            px-[40px]
            py-[70px]
            md:px-[70px]
            lg:px-[95px]
        "
    >

        <div
            class="
                flex
                w-full
                items-center
                justify-between
                gap-[70px]
                lg:gap-[100px]
                max-md:flex-col
                max-md:items-start
                max-md:gap-[55px]
            "
        >

            <div
                class="
                    flex
                    flex-1
                    flex-col
                    items-start
                    max-md:w-full
                "
            >

                <h1
                    class="
                        m-0
                        text-left
                        text-[44px]
                        font-normal
                        leading-[1.08]
                        tracking-[-1.8px]
                        text-neutral-600
                        sm:text-[48px]
                        md:text-[52px]
                    "
                >
                    Tentang KodeKita
                </h1>

                <p
                    class="
                        mt-[55px]
                        max-w-[460px]
                        text-left
                        text-[16px]
                        font-normal
                        leading-[1.6]
                        text-neutral-500
                        sm:text-[17px]
                        md:text-[18px]
                    "
                >
                    KodeKita adalah ruang untuk belajar,
                    berbagi, dan berkarya bersama melalui
                    teknologi. Kami hadir untuk mendorong
                    kreativitas, meningkatkan kemampuan
                    digital, serta membangun semangat
                    kolaborasi di antara para pelajar.
                </p>

                <a
                    href="#"
                    class="
                        mt-[24px]
                        inline-flex
                        items-center
                        justify-center
                        rounded-[8px]
                        bg-neutral-700
                        px-[18px]
                        py-[11px]
                        text-[14px]
                        font-medium
                        text-white
                        shadow-[0_3px_7px_rgba(0,0,0,0.22)]
                        transition-all
                        duration-200
                        hover:-translate-y-[2px]
                        hover:bg-neutral-800
                        active:translate-y-0
                    "
                >
                    Mulai Perjalanan Anda
                </a>

            </div>

            <div
                class="
                    flex
                    shrink-0
                    justify-end
                "
            >

                <img
                    src="./assets/about.png"
                    alt="Tentang KodeKita"
                    class="
                        h-[710px]
                        w-[500px]
                        rounded-[10px]
                        object-cover
                        object-center
                        shadow-sm
                        transition-transform
                        duration-300
                        hover:scale-[1.01]
                        max-lg:h-[380px]
                        max-lg:w-[430px]
                        max-md:h-[360px]
                        max-md:w-full
                        max-md:max-w-[500px]
                    "
                >

            </div>

        </div>

    </section>

</body>

</html>
